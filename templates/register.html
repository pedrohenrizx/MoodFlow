{% extends "base.html" %}
{% block content %}
<section class="max-w-xl mx-auto px-4 py-10">
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
    <h1 class="text-2xl font-semibold mb-1">Criar conta</h1>
    <p class="text-sm text-slate-300 mb-6">Todo o MoodFlow é gratuito e liberado para quem está logado.</p>
    {% if error %}
      <div class="mb-4 text-sm text-rose-200 bg-rose-500/10 border border-rose-500/40 rounded-lg px-3 py-2">{{ error }}</div>
    {% endif %}
    <form method="post" class="space-y-4">
      <div>
        <label for="name" class="text-sm text-slate-300">Nome (opcional)</label>
        <input id="name" name="name" type="text" class="mt-1 w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Como quer ser chamado?">
      </div>
      <div>
        <label for="email" class="text-sm text-slate-300">E-mail</label>
        <input id="email" name="email" type="email" required class="mt-1 w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="voce@email.com">
      </div>
      <div>
        <label for="password" class="text-sm text-slate-300">Senha</label>
        <input id="password" name="password" type="password" required minlength="6" class="mt-1 w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full py-3 rounded-lg bg-indigo-500 hover:bg-indigo-600 text-white font-semibold">Criar conta gratuita</button>
    </form>
    <p class="text-sm text-slate-400 mt-4">Já tem conta? <a class="text-indigo-300 hover:text-indigo-200" href="{{ url_for('login') }}">Entre aqui</a>.</p>
  </div>
</section>
{% endblock %}
